name: moto_dash
description: "A new Flutter project."
publish_to: 'none'
version: 0.4.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.2
  audioplayers: ^6.1.0
  call_log: ^6.0.1
  flex_color_picker: ^3.8.0
  flutter_local_notifications: ^21.0.0
  flutter_native_contact_picker_plus: ^1.3.1
  flutter_phone_direct_caller: ^2.2.1
  flutter_settings_screens: ^0.3.4
  flutter_tts: ^4.2.5
  geolocator: ^14.0.3
  permission_handler: ^12.0.1
  phone_state: ^3.0.1
  provider: ^6.1.5+1
  rotation_log: ^0.1.1
  screen_brightness: ^2.1.7
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3
  statemachine: ^3.4.0
  volume_controller: ^3.4.0
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # For app icon generation
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "assets/icon_background.png"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/beep.mp3

  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/AtkinsonHyperlegible.ttf
